
name: Tactical Strike Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tactical Strike repository
        uses: actions/checkout@v4

      - name: Download CS16 Client source
        run: git clone --depth 1 --recurse-submodules https://github.com/FWGS/cs16-client.git source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleGitDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-Strike-APK-test
          path: source/android/app/build/outputs/apk/git/debug/app-git-debug.apk
          if-no-files-found: error
          
