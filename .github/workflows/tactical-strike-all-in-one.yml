name: Tactical Strike All-in-One (armeabi-v7a)

on:
  workflow_dispatch:
  push:
    paths:
      - "inputs/**"
      - "launcher/**"
      - "scripts/**"
      - ".github/workflows/tactical-strike-all-in-one.yml"

env:
  APKTOOL_VERSION: "2.10.0"
  APP_PACKAGE: "com.tacticalstrike.game"
  APP_LABEL: "Tactical Strike"
  ENGINE_APK: inputs/Xash3D_FWGS__Test__1.apk
  CS_APK: inputs/CS16Client-Android_1.apk
  FINAL_NAME: Tactical-Strike-All-in-One-armeabi-v7a.apk

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install SDK platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check inputs exist
        run: |
          for f in "$ENGINE_APK" "$CS_APK"; do
            [ -f "$f" ] || { echo "::error::missing $f (put both APKs in inputs/)"; exit 1; }
          done
          ls -l inputs/

      - name: Download apktool
        run: |
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          java -jar apktool.jar --version

      - name: Decode engine APK, unpack CS16 APK
        run: |
          mkdir -p work
          java -jar apktool.jar d -f -o work/engine "$ENGINE_APK"
          unzip -q -o "$CS_APK" -d work/cs_raw
          # smali of the ORIGINAL CS16 launcher, kept in the report so the intent
          # extras used by LauncherActivity can be compared against it
          java -jar apktool.jar d -f --no-res -o work/cs_smali "$CS_APK"
          mkdir -p build-report
          find work/cs_smali -path '*cs16client*' -name '*.smali' -exec cat {} + > build-report/original_cs16_launcher.smali

      - name: Merge libs, assets, manifest
        run: |
          python3 scripts/merge_project.py --engine work/engine --cs-raw work/cs_raw \
            --package "$APP_PACKAGE" --label "$APP_LABEL"
          cp work/merge_report.json build-report/

      - name: Compile launcher to dex
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/35.0.0"
          JAR="$SDK/platforms/android-35/android.jar"
          mkdir -p work/launcher_classes work/launcher_dex
          javac --release 8 -cp "$JAR" -d work/launcher_classes \
            launcher/com/tacticalstrike/LauncherActivity.java
          (cd work/launcher_classes && jar cf ../launcher.jar .)
          "$BT/d8" --release --min-api 21 --lib "$JAR" --output work/launcher_dex work/launcher.jar
          ls -l work/launcher_dex

      - name: Rebuild APK and add launcher dex
        run: |
          java -jar apktool.jar b -o work/unsigned.apk work/engine
          python3 scripts/add_dex.py work/unsigned.apk work/launcher_dex/classes.dex work/with_dex.apk

      - name: Align and sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/35.0.0"
          mkdir -p dist
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > work/release.jks
            KS=work/release.jks; SP="$KEYSTORE_PASS"; AL="$KEY_ALIAS"; KP="$KEY_PASS"
          else
            echo "::warning::no signing secrets set - using a throw-away debug key (updates over an older install will fail)"
            keytool -genkeypair -keystore work/debug.jks -storepass android -keypass android \
              -alias tacticalstrike -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tactical Strike"
            KS=work/debug.jks; SP=android; AL=tacticalstrike; KP=android
          fi
          "$BT/zipalign" -p -f 4 work/with_dex.apk work/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$SP" --ks-key-alias "$AL" --key-pass "pass:$KP" \
            --out "dist/$FINAL_NAME" work/aligned.apk

      - name: Verify FINAL APK contents (fails the job on any problem)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          python3 scripts/verify_apk.py "dist/$FINAL_NAME" --cs-apk "$CS_APK" \
            --package "$APP_PACKAGE" --build-tools "$SDK/build-tools/35.0.0" | tee build-report/verify.txt
          unzip -l "dist/$FINAL_NAME" > build-report/apk_contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Tactical-Strike-All-in-One
          path: |
            dist/${{ env.FINAL_NAME }}
            build-report/
