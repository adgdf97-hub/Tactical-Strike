name: Build Tactical Strike All-in-One APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tactical-strike-all-in-one.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tactical Strike
        uses: actions/checkout@v4

      - name: Checkout engine and client with submodules
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/FWGS/xash3d-fwgs.git engine
          git clone --depth 1 --recurse-submodules https://github.com/FWGS/cs16-client.git client

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Counter-Strike client for 32-bit ARM
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGitDebug -Pandroid.injected.build.abi=armeabi-v7a

      - name: Locate and embed the 32-bit client library
        run: |
          set -euxo pipefail
          echo "Searching for the 32-bit ARM client library..."
          CLIENT_LIB="$(find client/android/app/build/intermediates -type f -path '*/lib/armeabi-v7a/libclient_android_armv7l.so' -print -quit)"
          if [ -z "$CLIENT_LIB" ]; then
            echo "::error::Could not find libclient_android_armv7l.so for armeabi-v7a."
            find client/android/app/build -type f -name '*.so' -print || true
            exit 1
          fi
          echo "Found client library: $CLIENT_LIB"
          mkdir -p engine/android/app/src/main/jniLibs/armeabi-v7a
          cp "$CLIENT_LIB" engine/android/app/src/main/jniLibs/armeabi-v7a/libclient.so
          file engine/android/app/src/main/jniLibs/armeabi-v7a/libclient.so
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("engine/android/app/build.gradle.kts")
          content = gradle.read_text()
          old = 'experimentalProperties["ninja.abiFilters"] = setOf("armeabi-v7a", "arm64-v8a", "x86")'
          new = 'experimentalProperties["ninja.abiFilters"] = setOf("armeabi-v7a")'
          if old not in content:
              raise SystemExit("Could not locate engine ABI filter in build.gradle.kts")
          gradle.write_text(content.replace(old, new, 1))
          manifest = Path("engine/android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          pattern = r'<activity\s+android:name="\.MainActivity"\s+android:exported="true">\s*<intent-filter>\s*<action android:name="android.intent.action.MAIN"\s*/>\s*<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>\s*</activity>'
          replacement = """<activity android:name=".MainActivity" android:exported="true" />
          <activity android:name=".TacticalLauncherActivity" android:exported="true">
            <intent-filter>
              <action android:name="android.intent.action.MAIN" />
              <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
          </activity>"""
          updated, count = re.subn(pattern, replacement, content, count=1)
          if count != 1:
              raise SystemExit("Could not find expected MainActivity launcher block")
          manifest.write_text(updated)
          launcher = Path("engine/android/app/src/main/java/su/xash/engine/TacticalLauncherActivity.java")
          launcher.parent.mkdir(parents=True, exist_ok=True)
          launcher.write_text("""package su.xash.engine;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          public final class TacticalLauncherActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Intent intent = new Intent(this, XashActivity.class);
                  intent.putExtra("gamedir", "cstrike");
                  intent.putExtra("gamelibdir", getApplicationInfo().nativeLibraryDir);
                  intent.putExtra("argv", "-dev 2 -log");
                  intent.putExtra("package", getPackageName());
                  startActivity(intent);
                  finish();
              }
          }
          """)
          PY

      - name: Build standalone Tactical Strike APK
        working-directory: engine/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK and stage artifact
        run: |
          set -euxo pipefail
          APK="$(find engine/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/.*\.so$'
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/libclient\.so$'
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "::error::APK unexpectedly contains arm64-v8a libraries"
            exit 1
          fi
          cp "$APK" Tactical-Strike-All-in-One-armeabi-v7a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-Strike-All-in-One-armeabi-v7a
          path: Tactical-Strike-All-in-One-armeabi-v7a.apk
          if-no-files-found: error
          
