
      - name: Locate and embed the 32-bit client library
        run: |
          set -euxo pipefail

          CLIENT_LIB="$(find client/android/app/build/intermediates -type f \
            -path '*/lib/armeabi-v7a/libclient_android_armv7l.so' \
            -print -quit)"

          if [ -z "$CLIENT_LIB" ]; then
            echo "::error::Could not find the 32-bit client library"
            find client/android/app/build -type f -name '*.so' -print
            exit 1
          fi

          mkdir -p engine/android/app/src/main/jniLibs/armeabi-v7a
          cp "$CLIENT_LIB" \
            engine/android/app/src/main/jniLibs/armeabi-v7a/libclient_android_armv7l.so

          file engine/android/app/src/main/jniLibs/armeabi-v7a/libclient_android_armv7l.so

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("engine/android/app/build.gradle.kts")
          content = gradle.read_text()
          old = 'experimentalProperties["ninja.abiFilters"] = setOf("armeabi-v7a", "arm64-v8a", "x86")'
          new = 'experimentalProperties["ninja.abiFilters"] = setOf("armeabi-v7a")'
          if old not in content:
              raise SystemExit("Could not locate engine ABI filter")
          gradle.write_text(content.replace(old, new, 1))

          manifest = Path("engine/android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          pattern = r'<activity\s+android:name="\.MainActivity"\s+android:exported="true">\s*<intent-filter>\s*<action android:name="android.intent.action.MAIN"\s*/>\s*<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>\s*</activity>'
          replacement = """<activity android:name=".MainActivity" android:exported="true" />
          <activity android:name=".TacticalLauncherActivity" android:exported="true">
            <intent-filter>
              <action android:name="android.intent.action.MAIN" />
              <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
          </activity>"""
          updated, count = re.subn(pattern, replacement, content, count=1)
          if count != 1:
              raise SystemExit("Could not find expected MainActivity launcher block")
          manifest.write_text(updated)

          launcher = Path("engine/android/app/src/main/java/su/xash/engine/TacticalLauncherActivity.java")
          launcher.parent.mkdir(parents=True, exist_ok=True)
          launcher.write_text("""package su.xash.engine;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          public final class TacticalLauncherActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Intent intent = new Intent(this, XashActivity.class);
                  intent.putExtra("gamedir", "cstrike");
                  intent.putExtra("gamelibdir", getApplicationInfo().nativeLibraryDir);
                  intent.putExtra("argv", "-dev 2 -log");
                  intent.putExtra("package", getPackageName());
                  startActivity(intent);
                  finish();
              }
          }
          """)
          PY
          
